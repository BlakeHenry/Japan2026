name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The Maps credentials are stored on the github-pages *environment*, and
    # environment secrets are only visible to jobs that declare it — without
    # this line they silently resolve to empty strings and the map compiles
    # out of the build with no error anywhere.
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          # Keep in sync with the packageManager field in package.json —
          # without this the action installs whatever "latest" is that day.
          package-manager: pnpm@11.20.0
          # pnpm 11.20.0 requires Node >=22.13; ubuntu-latest's default
          # runtime (20.x) is too old and pnpm fails before anything else
          # runs ("No such built-in module: node:sqlite").
          node-version: 22
        env:
          # Injected at build time so the key never lives in the repo. It IS
          # still present in the built output — the Maps JS SDK runs in the
          # browser — so the daily quota cap, not secrecy, is what prevents
          # abuse. Use the production key here (referrer-restricted to
          # japantrip2026.io, never localhost).
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_API_KEY }}
          PUBLIC_GOOGLE_MAPS_ID: ${{ vars.PUBLIC_GOOGLE_MAPS_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
